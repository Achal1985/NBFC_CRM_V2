<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMI Payment</title>

<style>

/* RESET */
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Segoe UI',sans-serif;
}

/* SAME BACKGROUND AS LOGIN */
body{
min-height:100dvh;
display:flex;
align-items:center;
justify-content:center;

background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#00c896);
background-size:400% 400%;
animation:gradientBG 12s ease infinite;

padding:15px;
overflow-x:hidden;
}

/* FLOATING LIGHT */
body::before,
body::after{
content:"";
position:absolute;
border-radius:50%;
filter:blur(80px);
z-index:0;
}

body::before{
width:300px;
height:300px;
background:#00e5ff33;
top:-80px;
left:-80px;
animation:float 10s infinite alternate;
}

body::after{
width:250px;
height:250px;
background:#00ffcc33;
bottom:-80px;
right:-80px;
animation:float 12s infinite alternate-reverse;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

@keyframes float{
from{transform:translate(0,0);}
to{transform:translate(30px,30px);}
}

/* GLASS CARD */
.container{
width:100%;
max-width:380px;
padding:28px;
border-radius:20px;
position:relative;
z-index:2;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,0.2);

box-shadow:
0 0 40px rgba(0,255,200,0.2),
inset 0 0 20px rgba(255,255,255,0.05);

text-align:center;
color:#fff;

animation:fadeUp 0.8s ease;
}

@keyframes fadeUp{
from{opacity:0; transform:translateY(25px);}
to{opacity:1; transform:translateY(0);}
}

/* LOGO */
.logo{
font-size:clamp(18px,5vw,24px);
font-weight:bold;
margin-bottom:10px;
}

/* INPUT */
input{
width:100%;
padding:14px;
margin:10px 0;

border-radius:12px;
border:1px solid rgba(255,255,255,0.2);

background:rgba(255,255,255,0.12);
color:#fff;
outline:none;

backdrop-filter:blur(10px);
}

/* PLACEHOLDER WHITE */
input::placeholder{
color:rgba(255,255,255,0.8);
}

/* BUTTON */
button{
width:100%;
padding:14px;
margin-top:10px;

border:none;
border-radius:12px;

background:linear-gradient(135deg,#00c896,#00e5ff);
color:#fff;

cursor:pointer;
font-size:15px;

transition:0.3s;
}

button:hover{
transform:scale(1.03);
box-shadow:0 0 15px rgba(0,255,200,0.6);
}

button:active{
transform:scale(0.97);
}

/* SUCCESS */
.success{
color:#00ff99;
font-weight:bold;
margin-top:15px;
}

/* MOBILE */
@media(max-width:480px){

.container{
padding:22px;
border-radius:16px;
}

input{
font-size:14px;
}

button{
font-size:14px;
padding:13px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">💳 PayU Payment</div>



<div id="cardSection">
<input type="text" id="emiAmount" placeholder="Enter EMI Amount">
<input type="text" id="cardNumber" placeholder="Enter Card Number" maxlength="16">
<input type="text" placeholder="MM/YY">
<input type="password" placeholder="CVV" maxlength="3">

<button onclick="sendOTP()">Proceed</button>

</div>

<div id="otpSection" style="display:none;">

<input type="password" id="otp" placeholder="Enter OTP" maxlength="6">

<button onclick="verifyPayment()">Verify OTP</button>

</div>

<div id="successMsg" class="success" style="display:none;">
✅ Payment Successful!
</div>

</div>

<script>

function sendOTP(){

let emi = document.getElementById("emiAmount").value.trim()
let card = document.getElementById("cardNumber").value.trim()

// ✅ EMI validation first
if(!/^[0-9]+$/.test(emi) || parseInt(emi) <= 0){
    alert("Enter valid EMI amount")
    return
}

// ✅ Card validation
if(card.length !== 16 || !/^[0-9]+$/.test(card)){
    alert("Enter valid 16 digit card number")
    return
}

// Proceed
document.getElementById("cardSection").style.display="none"
document.getElementById("otpSection").style.display="block"
document.getElementById("emiAmount").addEventListener("input", function(){
    this.value = this.value.replace(/[^0-9]/g, "");
});

}
function verifyPayment(){

let otp = document.getElementById("otp").value

if(otp === "123456"){

document.getElementById("otpSection").style.display="none"
document.getElementById("successMsg").style.display="block"

setTimeout(()=>{
    window.location.href="/dashboard"
},2000)

}else{
alert("Invalid OTP")
}

}

</script>

</body>
</html>
