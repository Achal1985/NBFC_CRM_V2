<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMI Payment</title>

<style>

body{
font-family:Segoe UI;
margin:0;
background:linear-gradient(-45deg,#1f4037,#99f2c8,#0f2027,#2c5364);
background-size:400% 400%;
animation:gradientMove 12s ease infinite;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
background:white;
padding:30px;
border-radius:12px;
width:90%;
max-width:350px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.logo{
font-size:22px;
font-weight:bold;
color:#1f4037;
margin-bottom:15px;
}

@media(max-width:480px){

body{
    padding:10px;
    height:auto;
}

.container{
    padding:20px;
}

.logo{
    font-size:18px;
}

input{
    font-size:14px;
}

button{
    font-size:14px;
}

}

input{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:12px;
background:#ff6a00;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

.success{
color:green;
font-weight:bold;
margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">💳 PayU Payment</div>

<div id="cardSection">

<input type="text" id="cardNumber" placeholder="Enter Card Number" maxlength="16">
<input type="text" placeholder="MM/YY">
<input type="password" placeholder="CVV" maxlength="3">

<button onclick="sendOTP()">Proceed</button>

</div>

<div id="otpSection" style="display:none;">

<input type="password" id="otp" placeholder="Enter OTP" maxlength="6">

<button onclick="verifyPayment()">Verify OTP</button>

</div>

<div id="successMsg" class="success" style="display:none;">
✅ Payment Successful!
</div>

</div>

<script>

function sendOTP(){

let card = document.getElementById("cardNumber").value

if(card.length !== 16){
    alert("Enter valid 16 digit card number")
    return
}

document.getElementById("cardSection").style.display="none"
document.getElementById("otpSection").style.display="block"

}

function verifyPayment(){

let otp = document.getElementById("otp").value

if(otp === "123456"){

document.getElementById("otpSection").style.display="none"
document.getElementById("successMsg").style.display="block"

setTimeout(()=>{
    window.location.href="/dashboard"
},2000)

}else{
alert("Invalid OTP")
}

}

</script>

</body>
</html>
