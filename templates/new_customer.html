<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RFL Loan ChatBot</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* RESET */
*{
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

/* BACKGROUND */
body{
margin:0;
height:100dvh;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364,#0f9b0f);
background-size:400% 400%;
animation:bgMove 15s ease infinite;
display:flex;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* CONTAINER (GLASS) */
.container{
width:100%;
height:100dvh;
display:flex;
flex-direction:column;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);
box-shadow:inset 0 0 20px rgba(255,255,255,0.05);
}

/* DESKTOP */
@media(min-width:600px){
body{
justify-content:center;
align-items:center;
}
.container{
max-width:420px;
height:95vh;
border-radius:25px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.2);
box-shadow:
0 0 50px rgba(0,255,200,0.25),
inset 0 0 25px rgba(255,255,255,0.08);
}
}

/* HEADER */
.header{
background:rgba(0,166,125,0.7);
backdrop-filter:blur(15px);
color:#fff;
padding:15px;
text-align:center;
font-weight:bold;
letter-spacing:1px;
position:relative;
border-bottom:1px solid rgba(255,255,255,0.2);
}

.header button{
position:absolute;
right:10px;
top:10px;
background:rgba(255,255,255,0.2);
border:none;
border-radius:50%;
padding:8px;
cursor:pointer;
color:#fff;
transition:0.3s;
}

.header button:hover{
background:#00c896;
}

/* CHAT */
.chat-box{
flex:1;
overflow-y:auto;
padding:15px;
}

/* SCROLL */
.chat-box::-webkit-scrollbar{
width:6px;
}
.chat-box::-webkit-scrollbar-thumb{
background:rgba(0,255,200,0.6);
border-radius:10px;
}

/* MESSAGE */
.msg{
margin:10px 0;
display:flex;
animation:fadeIn 0.3s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

/* BOT */
.bot{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
padding:12px;
border-radius:14px;
max-width:80%;
color:#fff;
border:1px solid rgba(255,255,255,0.2);
box-shadow:0 4px 20px rgba(0,0,0,0.2);
}

/* USER */
.user{
margin-left:auto;
background:linear-gradient(135deg,#00c896,#00e5ff);
padding:12px;
border-radius:14px;
max-width:80%;
color:#fff;
box-shadow:0 4px 20px rgba(0,0,0,0.3);
}

/* INPUT AREA */
.input-area{
display:flex;
padding:10px;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(20px);
border-top:1px solid rgba(255,255,255,0.15);
}

/* INPUT */
input{
flex:1;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,0.15);
color:#fff;
font-size:15px;
}

/* BUTTON */
button{
background:linear-gradient(135deg,#00c896,#00e5ff);
border:none;
color:#fff;
padding:12px 16px;
margin-left:8px;
border-radius:12px;
cursor:pointer;
transition:all 0.3s ease;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 15px rgba(0,255,200,0.6);
}

/* OPTION BUTTON */
.option-btn{
width:100%;
margin-top:10px;
padding:12px;
border-radius:12px;
background:rgba(255,255,255,0.12);
color:#fff;
border:1px solid rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
transition:0.3s;
}

.option-btn:hover{
background:#00c896;
}

.file-label{
display:block;
background:rgba(255,255,255,0.15);
padding:10px;
border-radius:10px;
text-align:center;
cursor:pointer;
border:1px solid rgba(255,255,255,0.2);
}

.file-label input{
display:none;
}

.file-label span{
color:#fff;
font-size:14px;
}

/* UPLOAD */
.upload-box{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(12px);
padding:15px;
border-radius:15px;
margin-top:12px;
color:#fff;
border:1px solid rgba(255,255,255,0.2);
}

/* MOBILE */
@media(max-width:600px){
.container{
height:100dvh;
border-radius:0;
}
input{
font-size:16px; /* prevent zoom */
}
}

</style>
</head>

<body>

<div class="container">

<div class="header">
🤖 RFL Loan ChatBot
<button onclick="toggleVoice()">🔊</button>
</div>

<div id="chatBox" class="chat-box"></div>

<div class="input-area">
<input id="userInput"
placeholder="Type 'hi' to start"
oninput="handleInput(this)"
enterkeyhint="send"
autocomplete="off"
style="text-transform: uppercase;">
<button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
</div>

</div>

<!-- ⚠️ BELOW SCRIPT IS 100% UNCHANGED -->
<script>
window.onload = function(){
    focusInput();
}

let step="start"
let data={}

function box(){ return document.getElementById("chatBox") }

function msg(text,type){
    let d=document.createElement("div")
    d.className="msg"

    let b=document.createElement("div")
    b.className=type
    b.innerHTML=text

    d.appendChild(b)
    box().appendChild(d)

    box().scrollTop=box().scrollHeight

    // 🔊 Speak only bot messages
    if(type === "bot"){
        speak(text)
    }
}

function buttons(arr){
    arr.forEach(a=>{
        let btn=document.createElement("button")
        btn.className="option-btn"
        btn.innerText=a.text

      btn.onclick=()=>{
    a.action()   // only call action
}

        box().appendChild(btn)
    })

    box().scrollTop = box().scrollHeight;
}
function selectEmployment(type){
    data.employment=type
    msg(type,"user")
    msg("💰 Enter Monthly Income:","bot")
    step="income"
    focusInput();
}

function showFileName(input, id){
    if(input.files.length > 0){
        let name = input.files[0].name;

        // ✅ Show file name in UI
        document.getElementById(id).innerText = "✅ " + name;

        // ✅ Speak only generic message
        speak("Document uploaded successfully");
    }
}

function lockChat(){

    // Disable text input
    document.getElementById("userInput").disabled = true;

    // Disable send button
    document.querySelector(".input-area button").disabled = true;

    // Disable all option buttons
    document.querySelectorAll(".option-btn").forEach(btn=>{
        btn.disabled = true;
        btn.style.opacity = "0.5";
        btn.style.cursor = "not-allowed";
    });

    // ✅ NEW: Disable all file inputs
    document.querySelectorAll("input[type='file']").forEach(file=>{
        file.disabled = true;
        file.style.opacity = "0.5";
        file.style.cursor = "not-allowed";
    });

}

function botSequence(messages, delay = 1500){

    messages.forEach((text, index) => {
        setTimeout(() => {
            msg(text, "bot");
        }, index * delay);
    });
}

function toggleVoice(){
    voiceEnabled = !voiceEnabled;
    alert(voiceEnabled ? "Voice ON" : "Voice OFF");
}

function showBusinessOptions(){

    buttons([
        {text:"Retail Shop", action:()=>selectBusiness("Retail Shop")},
        {text:"Manufacturing", action:()=>selectBusiness("Manufacturing")},
        {text:"IT Services", action:()=>selectBusiness("IT Services")},
        {text:"Trading Business", action:()=>selectBusiness("Trading Business")},
        {text:"Others", action:()=>enterCustomBusiness()}
    ])

    step="business_select"
}

function selectBusiness(name){
    data.business = name
    msg(name,"user")
    msg("📅 Years in Business:","bot")
    step="years"
    focusInput();
}

function enterCustomBusiness(){
    msg("Others","user")
    msg("✍️ Enter Your Business Name:","bot")
    step="business_manual"
    focusInput();
}

function handleSubmit(btn){

    let pan = document.querySelector("input[onchange*='panFile']").files.length;
    let aadhaar = document.querySelector("input[onchange*='aadhaarFile']").files.length;
    let bank = document.querySelector("input[onchange*='bankFile']").files.length;

    if(pan === 0 || aadhaar === 0 || bank === 0){
        msg("❌ Please upload all required documents before submitting","bot");
        return;
    }

    // ✅ Disable button after click
    btn.disabled = true;
    btn.style.opacity = "0.5";
    btn.style.cursor = "not-allowed";

    underwriting();
}


function focusInput(){
    let input = document.getElementById("userInput")
    if(!input.disabled){
        setTimeout(()=>input.focus(), 300); // mobile delay fix
    }
}

function handleInput(input){

    // ✅ Always uppercase
    input.value = input.value.toUpperCase();

    // ✅ Only numbers for these steps
    if(step === "income" || step === "amount" || step === "years"){
        input.value = input.value.replace(/[^0-9]/g, "");
    }

    // ✅ Only characters for name
    if(step === "name"){
        input.value = input.value.replace(/[^A-Z\s]/g, "");
    }
}
function sendMessage(){
let input=document.getElementById("userInput").value.trim()
if(!input || document.getElementById("userInput").disabled) return

if(step === "otp" || step === "aadhaar"){
    msg("••••","user")   // Hide OTP
} else {
    msg(input,"user")
}
document.getElementById("userInput").value=""

input = input.toUpperCase()
flow(input)
}

function flow(input){

input=input.toUpperCase()

if(input==="HI"){
box().innerHTML=""
msg("👋 Welcome to RFL Loan Chatbot","bot")
msg("Select Loan Type:","bot")

buttons([
{text:"Business Loan",action:()=>selectLoan("Business Loan")},
{text:"Loan Against Property",action:()=>selectLoan("LAP")},
{text:"SME Secured Loan",action:()=>selectLoan("SME Secured")},
{text:"SME Unsecured Loan",action:()=>selectLoan("SME Unsecured")}
])

step="loan_select"   // ✅ FIXED
return
}

else if(step==="name"){

if(!/^[A-Z\s]+$/.test(input)){
msg("❌ Enter valid name (letters only)","bot")
return
}

if(input.trim() === ""){
msg("❌ Name cannot be empty","bot")
return
}

data.name=input
msg("📱 Enter Mobile Number:","bot")
step="mobile"
}

else if(step==="mobile"){

if(!/^[0-9]{10}$/.test(input)){
msg("❌ Invalid Mobile Number. Enter 10 digit number","bot")
return
}

data.mobile=input
msg("📲 Enter OTP (••••):","bot")
step="otp"
}

else if(step==="otp"){
if(input==="1234"){
msg("✅ Mobile Verified","bot")
msg("🪪 Enter PAN Number:","bot")
step="pan"
}else msg("❌ Wrong OTP","bot")
}

else if(step==="pan"){

if(!/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(input)){
msg("❌ Invalid PAN Format (Example: ABCDE1234F)","bot")
return
}

data.pan=input
msg("🆔 Enter Aadhaar OTP (••••):","bot")
step="aadhaar"
}
else if(step==="aadhaar"){
    if(input==="1111"){
        botSequence([
    "🔐 KYC Completed",
    "📊 Checking CIBIL Score...",
    "✅ CIBIL Score: 750",
    "🏢 Select Business Name:"
], 1800);

setTimeout(() => {
    showBusinessOptions();
}, 7200);

    }else msg("❌ Invalid OTP","bot")
}

else if(step==="business_manual"){
    data.business = input
    msg("📅 Years in Business:","bot")
    step="years"
}

else if(step==="years"){

if(!/^[0-9]+$/.test(input) || parseInt(input) <= 0){
msg("❌ Enter valid years (numbers only & > 0)","bot")
return
}

data.years=input

msg("💼 Select Employment Status:","bot")

buttons([
{text:"Salaried",action:()=>selectEmployment("Salaried")},
{text:"Self Employed",action:()=>selectEmployment("Self Employed")}
])

step="employment"
}

else if(step==="employment"){
data.years=input
msg("💼 Enter Monthly Income:","bot")
step="income"
}

else if(step==="income"){

    if(!/^[0-9]+$/.test(input) || parseInt(input) <= 0){
        msg("❌ Enter valid income (numbers only & > 0)","bot")
        return
    }

    data.income = parseInt(input)
    msg("💰 Enter Loan Amount:","bot")
    step="amount"
}

else if(step==="amount"){

    if(!/^[0-9]+$/.test(input) || parseInt(input) <= 0){
        msg("❌ Enter valid loan amount (numbers only & > 0)","bot")
        return
    }

    let eligible = data.income * 10

    if(parseInt(input) <= eligible){
        msg("✅ Eligible","bot")
        msg("🎯 Loan Offer: ₹" + eligible,"bot")
        msg("📄 Upload Valid Documents","bot")
        offer()
    }else{
        msg("❌ Not Eligible, enter lower amount","bot")
    }
}
}

function selectLoan(type){
    data.product=type
    msg(type,"user")
    msg("Enter Full Name:","bot")
    step="name"
    focusInput();
}

function offer(){
let div=document.createElement("div")
div.className="upload-box"

div.innerHTML=`

<b>📄 Upload Valid Documents</b><br><br>

PAN Card:<br>
<label class="file-label">
<input type="file" onchange="showFileName(this,'panFile')">
<span>📎 Upload PAN</span>
</label>
<div id="panFile"></div><br>

Aadhaar Card:<br>
<label class="file-label">
<input type="file" onchange="showFileName(this,'aadhaarFile')">
<span>📎 Upload Aadhaar</span>
</label>
<div id="aadhaarFile"></div><br>

Bank Statement:<br>
<label class="file-label">
<input type="file" onchange="showFileName(this,'bankFile')">
<span>📎 Upload Bank Statement</span>
</label>
<div id="bankFile"></div><br>

<button onclick="handleSubmit(this)" class="option-btn">Submit</button>

`

box().appendChild(div)
box().scrollTop = box().scrollHeight;

}


function underwriting(){

    let pan = document.querySelector("input[onchange*='panFile']").files.length;
    let aadhaar = document.querySelector("input[onchange*='aadhaarFile']").files.length;
    let bank = document.querySelector("input[onchange*='bankFile']").files.length;

    if(pan === 0 || aadhaar === 0 || bank === 0){
        msg("❌ Please upload all required documents (PAN, Aadhaar, Bank Statement)","bot");
        return;
    }

    botSequence([
        "🧠 Underwriting in Progress...",
        "✅ Loan Approved",
        "📄 Accept Agreement"
    ], 1800);

    setTimeout(()=>{
        let btn=document.createElement("button")
        btn.className="option-btn"
        btn.innerText="Accept Agreement"
        btn.onclick=esign
        box().appendChild(btn)
    }, 5400); // after sequence
}

function esign(){

    botSequence([
        "✍️ e Sign Completed",
        "🏦 Disbursement Initiated",
        "💰 Amount Credited"
    ], 1800);

    setTimeout(()=>{

        let acc="RFL"+Math.floor(Math.random()*100000000)

        msg("📊 Loan Account Created: "+acc,"bot")
        msg("🎉 Your "+data.product+" Loan is successfully disbursed and Copy of Loan Agreement has been sent to your registered mobile and email ID","bot")
        msg("🙏 Thanks for choosing RFL Loan - "+data.product,"bot")

        document.getElementById("userInput").disabled = true
        document.querySelector(".input-area button").disabled = true

        lockChat()

        let btn=document.createElement("button")
        btn.className="option-btn"
        btn.innerText="⬅ Go Back to Login"
        btn.onclick=goToLogin

        box().appendChild(btn)

    }, 6000);
}

document.getElementById("userInput").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        sendMessage();
    }
});

function goToLogin(){
window.location.href="/"
}

let voiceEnabled = true;

let voiceQueue = [];
let isSpeaking = false;

function speak(text){

    if(!voiceEnabled) return;

    // Clean text
    let cleanText = text.replace(/<[^>]*>/g, "")
                        .replace(/\(.*?•+.*?\)/g, "")
                        .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, "")
                        .replace(/\s+/g, " ")
                        .trim();

    if(!cleanText) return;

    // Push to queue
    voiceQueue.push(cleanText);

    // Start speaking if not already
    if(!isSpeaking){
        processQueue();
    }
}

function processQueue(){
    if(voiceQueue.length === 0){
        isSpeaking = false;
        return;
    }

    isSpeaking = true;

    const speech = new SpeechSynthesisUtterance(voiceQueue.shift());

    speech.lang = "en-IN";
    speech.rate = 1;
    speech.pitch = 1;

    speech.onend = () => {
        setTimeout(processQueue, 400); // slight gap between messages
    };

    window.speechSynthesis.speak(speech);
}
</script>


</body>
</html>
