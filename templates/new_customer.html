<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RFL Loan ChatBot</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
box-sizing:border-box;
font-family:'Segoe UI';
}

body{
margin:0;
height:100dvh;
background:linear-gradient(135deg,#0f2027,#134e5e,#0f9b0f);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
display:flex;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* MAIN CONTAINER */
.container{
width:100%;
height:100dvh;
display:flex;
flex-direction:column;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
}

/* DESKTOP */
@media(min-width:600px){
body{
justify-content:center;
align-items:center;
}
.container{
max-width:420px;
height:95vh;
border-radius:25px;
overflow:hidden;
box-shadow:0 0 40px rgba(0,255,150,0.25);
}
}

.header{
background:rgba(0,166,125,0.95);
color:#fff;
padding:15px;
text-align:center;
font-weight:bold;
}

/* CHAT */
.chat-box{
flex:1;
overflow-y:auto;
padding:12px;
}

/* MESSAGE */
.msg{
margin:8px 0;
display:flex;
}

.bot{
background:#fff;
padding:10px;
border-radius:12px;
max-width:80%;
}

.user{
margin-left:auto;
background:#009e74;
color:#fff;
padding:10px;
border-radius:12px;
max-width:80%;
}

/* INPUT FIXED INSIDE FLEX */
.input-area{
display:flex;
background:rgba(0,0,0,0.5);
}

input{
flex:1;
padding:14px;
border:none;
outline:none;
background:transparent;
color:white;
font-size:16px;
}

button{
background:#00c896;
border:none;
color:#fff;
padding:14px;
}

/* BUTTONS */
.option-btn{
width:100%;
margin-top:8px;
padding:12px;
background:#00c896;
border:none;
color:#fff;
border-radius:10px;
}

/* UPLOAD */
.upload-box{
background:#fff;
padding:10px;
border-radius:10px;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
🤖 RFL Loan ChatBot
<button onclick="toggleVoice()" style="float:right;">🔊</button>
</div>

<div id="chatBox" class="chat-box"></div>

<div class="input-area">
<input id="userInput" placeholder="Type 'hi' to start" oninput="allowOnlyNumbers(this)">
<button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
</div>

</div>

<script>

let step="start"
let data={}
let speechQueue = [];
let isSpeaking = false;

function box(){ return document.getElementById("chatBox") }

function msg(text,type){

    let d=document.createElement("div")
    d.className="msg"

    let b=document.createElement("div")
    b.className=type
    b.innerHTML=text

    d.appendChild(b)
    box().appendChild(d)

    box().scrollTop=box().scrollHeight

    if(type === "bot"){
        waitAndSpeak(text)
    }
}

function waitAndSpeak(text){

    let check = setInterval(()=>{

        if(!speaking){
            clearInterval(check);
            speak(text);
        }

    }, 300);
}

function buttons(arr){
    arr.forEach(a=>{
        let btn=document.createElement("button")
        btn.className="option-btn"
        btn.innerText=a.text

      btn.onclick=()=>{
    a.action()   // only call action
}

        box().appendChild(btn)
    })

    box().scrollTop = box().scrollHeight;
}
function selectEmployment(type){
    data.employment=type
    msg(type,"user")
    msg("💰 Enter Monthly Income:","bot")
    step="income"
    focusInput();
}

function showFileName(input, id){
    if(input.files.length > 0){
        let name = input.files[0].name;
        document.getElementById(id).innerText = "✅ " + name;

        speak("File uploaded " + name);
    }
}

function lockChat(){

    // Disable text input
    document.getElementById("userInput").disabled = true;

    // Disable send button
    document.querySelector(".input-area button").disabled = true;

    // Disable all option buttons
    document.querySelectorAll(".option-btn").forEach(btn=>{
        btn.disabled = true;
        btn.style.opacity = "0.5";
        btn.style.cursor = "not-allowed";
    });

    // ✅ NEW: Disable all file inputs
    document.querySelectorAll("input[type='file']").forEach(file=>{
        file.disabled = true;
        file.style.opacity = "0.5";
        file.style.cursor = "not-allowed";
    });

}

function toggleVoice(){
    voiceEnabled = !voiceEnabled;
    alert(voiceEnabled ? "Voice ON" : "Voice OFF");
}

function processQueue(){

    if(isSpeaking || messageQueue.length === 0) return;

    isSpeaking = true;

    let item = messageQueue.shift();

    // Show message
    let d=document.createElement("div")
    d.className="msg"

    let b=document.createElement("div")
    b.className=item.type
    b.innerHTML=item.text

    d.appendChild(b)
    box().appendChild(d)
    box().scrollTop=box().scrollHeight

    // If bot → speak with delay
    if(item.type === "bot"){

        setTimeout(()=>{

            speak(item.text);

            // Wait until speech ends
            let checkSpeech = setInterval(()=>{
                if(!window.speechSynthesis.speaking){
                    clearInterval(checkSpeech);
                    isSpeaking = false;
                    processQueue(); // next message
                }
            }, 300);

        }, 500); // delay before speaking

    } else {
        // user message → small delay
        setTimeout(()=>{
            isSpeaking = false;
            processQueue();
        }, 300);
    }
}

function botSequence(messages, delay = 1200){

    let i = 0;

    function next(){

        if(i >= messages.length) return;

        msg(messages[i], "bot");
        i++;

        setTimeout(next, delay);
    }

    next();
}

function waitForSpeechEnd(callback){

    let check = setInterval(()=>{

        if(!window.speechSynthesis.speaking){
            clearInterval(check);
            setTimeout(callback, 300); // small natural delay
        }

    }, 200);
}

function showBusinessOptions(){

    buttons([
        {text:"Retail Shop", action:()=>selectBusiness("Retail Shop")},
        {text:"Manufacturing", action:()=>selectBusiness("Manufacturing")},
        {text:"IT Services", action:()=>selectBusiness("IT Services")},
        {text:"Trading Business", action:()=>selectBusiness("Trading Business")},
        {text:"Others", action:()=>enterCustomBusiness()}
    ])

    step="business_select"
}

function selectBusiness(name){
    data.business = name
    msg(name,"user")
    msg("📅 Years in Business:","bot")
    step="years"
    focusInput();
}

function enterCustomBusiness(){
    msg("Others","user")
    msg("✍️ Enter Your Business Name:","bot")
    step="business_manual"
    focusInput();
}

function handleSubmit(btn){

    let pan = document.querySelector("input[onchange*='panFile']").files.length;
    let aadhaar = document.querySelector("input[onchange*='aadhaarFile']").files.length;
    let bank = document.querySelector("input[onchange*='bankFile']").files.length;

    if(pan === 0 || aadhaar === 0 || bank === 0){
        msg("❌ Please upload all required documents before submitting","bot");
        return;
    }

    // ✅ Disable button after click
    btn.disabled = true;
    btn.style.opacity = "0.5";
    btn.style.cursor = "not-allowed";

    underwriting();
}


function focusInput(){
    let input = document.getElementById("userInput")
    if(!input.disabled){
        input.focus()
    }
}

function allowOnlyNumbers(input){

    if(step === "income" || step === "amount"){
        // Remove non-numeric characters
        input.value = input.value.replace(/[^0-9]/g, "");
    }

}

function sendMessage(){
let input=document.getElementById("userInput").value.trim()
if(!input || document.getElementById("userInput").disabled) return

if(step === "otp" || step === "aadhaar"){
    msg("••••","user")   // Hide OTP
} else {
    msg(input,"user")
}
document.getElementById("userInput").value=""

input = input.toUpperCase()
flow(input)
}

function flow(input){

input=input.toUpperCase()

if(input==="HI"){
box().innerHTML=""
msg("👋 Welcome to RFL Loan Chatbot","bot")
msg("Select Loan Type:","bot")

buttons([
{text:"Business Loan",action:()=>selectLoan("Business Loan")},
{text:"Loan Against Property",action:()=>selectLoan("LAP")},
{text:"SME Secured Loan",action:()=>selectLoan("SME Secured")},
{text:"SME Unsecured Loan",action:()=>selectLoan("SME Unsecured")}
])

step="name"
return
}

else if(step==="name"){
data.name=input
msg("📱 Enter Mobile Number:","bot")
step="mobile"
}

else if(step==="mobile"){

if(!/^[0-9]{10}$/.test(input)){
msg("❌ Invalid Mobile Number. Enter 10 digit number","bot")
return
}

data.mobile=input
msg("📲 Enter OTP (••••):","bot")
step="otp"
}

else if(step==="otp"){
if(input==="1234"){
msg("✅ Mobile Verified","bot")
msg("🪪 Enter PAN Number:","bot")
step="pan"
}else msg("❌ Wrong OTP","bot")
}

else if(step==="pan"){

if(!/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(input)){
msg("❌ Invalid PAN Format (Example: ABCDE1234F)","bot")
return
}

data.pan=input
msg("🆔 Enter Aadhaar OTP (••••):","bot")
step="aadhaar"
}
else if(step==="aadhaar"){
    if(input==="1111"){
        msg("🔐 KYC Completed","bot")
        msg("📊 Checking CIBIL Score...","bot")

        setTimeout(()=>{
            msg("✅ CIBIL Score: 750","bot")
            msg("🏢 Select Business Name:","bot")

            showBusinessOptions()

        },1000)

    }else msg("❌ Invalid OTP","bot")
}

else if(step==="business_manual"){
    data.business = input
    msg("📅 Years in Business:","bot")
    step="years"
}

else if(step==="years"){
data.years=input

msg("💼 Select Employment Status:","bot")

buttons([
{text:"Salaried",action:()=>selectEmployment("Salaried")},
{text:"Self Employed",action:()=>selectEmployment("Self Employed")}
])

step="employment"
}

else if(step==="employment"){
data.years=input
msg("💼 Enter Monthly Income:","bot")
step="income"
}

else if(step==="income"){

    if(!/^[0-9]+$/.test(input) || parseInt(input) <= 0){
        msg("❌ Enter valid income (numbers only & > 0)","bot")
        return
    }

    data.income = parseInt(input)
    msg("💰 Enter Loan Amount:","bot")
    step="amount"
}

else if(step==="amount"){

    if(!/^[0-9]+$/.test(input) || parseInt(input) <= 0){
        msg("❌ Enter valid loan amount (numbers only & > 0)","bot")
        return
    }

    let eligible = data.income * 10

    if(parseInt(input) <= eligible){
        msg("✅ Eligible","bot")
        msg("🎯 Loan Offer: ₹" + eligible,"bot")
        msg("📄 Valid Upload Documents","bot")
        offer()
    }else{
        msg("❌ Not Eligible, enter lower amount","bot")
    }
}
}

function selectLoan(type){
    data.product=type
    msg(type,"user")
    msg("Enter Full Name:","bot")
    step="name"
    focusInput();
}

function offer(){
let div=document.createElement("div")
div.className="upload-box"

div.innerHTML=`

<b>📄 Valid Upload Documents</b><br><br>

PAN Card:<br>
<input type="file" onchange="showFileName(this,'panFile')">
<div id="panFile" style="font-size:12px;color:green;"></div><br>

Aadhaar Card:<br>
<input type="file" onchange="showFileName(this,'aadhaarFile')">
<div id="aadhaarFile" style="font-size:12px;color:green;"></div><br>

Bank Statement:<br>
<input type="file" onchange="showFileName(this,'bankFile')">
<div id="bankFile" style="font-size:12px;color:green;"></div><br>

<button onclick="handleSubmit(this)" class="option-btn">Submit</button>

`

box().appendChild(div)
box().scrollTop = box().scrollHeight;

}


function underwriting(){

    let pan = document.querySelector("input[onchange*='panFile']").files.length;
    let aadhaar = document.querySelector("input[onchange*='aadhaarFile']").files.length;
    let bank = document.querySelector("input[onchange*='bankFile']").files.length;

    if(pan === 0 || aadhaar === 0 || bank === 0){
        msg("❌ Please upload all required documents (PAN, Aadhaar, Bank Statement)","bot");
        return;
    }

    msg("🧠 Underwriting in Progress...","bot");

    setTimeout(()=>{
        msg("✅ Loan Approved","bot")
        msg("📄 Accept Agreement","bot")

        let btn=document.createElement("button")
        btn.className="option-btn"
        btn.innerText="Accept Agreement"
        btn.onclick=esign
        box().appendChild(btn)

    },2000)
}

function esign(){

    msg("✍️ eSign Completed","bot")
    msg("🏦 Disbursement Initiated","bot")
    msg("💰 Amount Credited","bot")

    let acc="RFL"+Math.floor(Math.random()*100000000)

    msg("📊 Loan Account Created: "+acc,"bot")
    msg("🎉 Your "+data.product+" is successfully disbursed.","bot")
    msg("🙏 Thanks for choosing RFL - "+data.product,"bot")

    document.getElementById("userInput").disabled = true
    document.querySelector(".input-area button").disabled = true

    lockChat()

    let btn=document.createElement("button")
    btn.className="option-btn"
    btn.innerText="⬅ Go Back to Login"
    btn.onclick=goToLogin

    box().appendChild(btn)
}
    }

    nextStep();
}

document.getElementById("userInput").addEventListener("keypress",function(e){
if(e.key==="Enter"){
sendMessage()
}
})

function goToLogin(){
window.location.href="/"
}

let voiceEnabled = true;

let speaking = false;

function speak(text){

    if(!voiceEnabled) return;

    // Clean text
    let cleanText = text
        .replace(/<[^>]*>/g, "")
        .replace(/\(.*?•+.*?\)/g, "")
        .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, "")
        .replace(/\s+/g, " ")
        .trim();

    if(!cleanText) return;

    // Add to queue
    speechQueue.push(cleanText);

    processSpeechQueue();
}

function processSpeechQueue(){

    if(isSpeaking || speechQueue.length === 0) return;

    isSpeaking = true;

    const text = speechQueue.shift();

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "en-IN";
    speech.rate = 1;
    speech.pitch = 1;

    speech.onend = () => {
        isSpeaking = false;
        processSpeechQueue(); // next message
    };

    window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
