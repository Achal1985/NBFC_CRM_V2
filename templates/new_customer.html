<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RFL Loan AI Assistant</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
box-sizing:border-box;
font-family:'Segoe UI';
}

body{
margin:0;
height:100dvh;
background:linear-gradient(135deg,#0f2027,#134e5e,#0f9b0f);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
display:flex;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* MAIN CONTAINER */
.container{
width:100%;
height:100dvh;
display:flex;
flex-direction:column;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
}

/* DESKTOP */
@media(min-width:600px){
body{
justify-content:center;
align-items:center;
}
.container{
max-width:420px;
height:95vh;
border-radius:25px;
overflow:hidden;
box-shadow:0 0 40px rgba(0,255,150,0.25);
}
}

.header{
background:rgba(0,166,125,0.95);
color:#fff;
padding:15px;
text-align:center;
font-weight:bold;
}

/* CHAT */
.chat-box{
flex:1;
overflow-y:auto;
padding:12px;
}

/* MESSAGE */
.msg{
margin:8px 0;
display:flex;
}

.bot{
background:#fff;
padding:10px;
border-radius:12px;
max-width:80%;
}

.user{
margin-left:auto;
background:#009e74;
color:#fff;
padding:10px;
border-radius:12px;
max-width:80%;
}

/* INPUT FIXED INSIDE FLEX */
.input-area{
display:flex;
background:rgba(0,0,0,0.5);
}

input{
flex:1;
padding:14px;
border:none;
outline:none;
background:transparent;
color:white;
font-size:16px;
}

button{
background:#00c896;
border:none;
color:#fff;
padding:14px;
}

/* BUTTONS */
.option-btn{
width:100%;
margin-top:8px;
padding:12px;
background:#00c896;
border:none;
color:#fff;
border-radius:10px;
}

/* UPLOAD */
.upload-box{
background:#fff;
padding:10px;
border-radius:10px;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">🤖 RFL Loan AI Assistant</div>

<div id="chatBox" class="chat-box"></div>

<div class="input-area">
<input id="userInput" placeholder="Type 'hi' to start">
<button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
</div>

</div>

<script>

let step="start"
let data={}

function box(){ return document.getElementById("chatBox") }

function msg(text,type){
let d=document.createElement("div")
d.className="msg"
let b=document.createElement("div")
b.className=type
b.innerHTML=text
d.appendChild(b)
box().appendChild(d)
box().scrollTop=box().scrollHeight
}

function buttons(arr){
arr.forEach(a=>{
let btn=document.createElement("button")
btn.className="option-btn"
btn.innerText=a.text
btn.onclick=a.action
box().appendChild(btn)
})
}

function sendMessage(){
let input=document.getElementById("userInput").value.trim()
if(!input) return

msg(input,"user")
document.getElementById("userInput").value=""

flow(input)
}

function flow(input){

input=input.toUpperCase()

if(input==="HI"){
box().innerHTML=""
msg("👋 Welcome to RFL Loan Assistant","bot")
msg("Select Loan Type:","bot")

buttons([
{text:"Business Loan",action:()=>selectLoan("Business Loan")},
{text:"Loan Against Property",action:()=>selectLoan("LAP")},
{text:"SME Secured Loan",action:()=>selectLoan("SME Secured")},
{text:"SME Unsecured Loan",action:()=>selectLoan("SME Unsecured")}
])

step="name"
return
}

else if(step==="name"){
data.name=input
msg("📱 Enter Mobile Number:","bot")
step="mobile"
}

else if(step==="mobile"){
msg("📲 Enter OTP (••••):","bot")
step="otp"
}

else if(step==="otp"){
if(input==="1234"){
msg("✅ Mobile Verified","bot")
msg("🪪 Enter PAN Number:","bot")
step="pan"
}else msg("❌ Wrong OTP","bot")
}

else if(step==="pan"){
data.pan=input
msg("🆔 Enter Aadhaar OTP (••••):","bot")
step="aadhaar"
}

else if(step==="aadhaar"){
if(input==="1111"){
msg("🔐 KYC Completed","bot")
msg("📊 Checking CIBIL Score...","bot")

setTimeout(()=>{
msg("✅ CIBIL Score: 750","bot")
msg("🏢 Enter Business Name:","bot")
step="business"
},1000)

}else msg("❌ Invalid OTP","bot")
}

else if(step==="business"){
data.business=input
msg("📅 Years in Business:","bot")
step="years"
}

else if(step==="years"){
data.years=input
msg("💼 Enter Monthly Income:","bot")
step="income"
}

else if(step==="income"){
data.income=parseInt(input)
msg("💰 Enter Loan Amount:","bot")
step="amount"
}

else if(step==="amount"){
let eligible=data.income*10

if(parseInt(input)<=eligible){
msg("✅ Eligible","bot")
msg("🎯 Loan Offer: ₹"+eligible,"bot")
msg("📄 Valid Upload Documents","bot")
offer()
}else{
msg("❌ Not Eligible, enter lower amount","bot")
}
}

}

function selectLoan(type){
data.product=type
msg(type,"user")
msg("Enter Full Name:","bot")
step="name"
}

function offer(){
let div=document.createElement("div")
div.className="upload-box"

div.innerHTML=`
PAN Card<br>
Aadhaar Card<br>
Bank Statement<br><br>
<input type="file"><br><br>
<button onclick="underwriting()" class="option-btn">Submit</button>
`

box().appendChild(div)
}

function underwriting(){
msg("🧠 Underwriting in Progress...","bot")

setTimeout(()=>{
msg("✅ Loan Approved","bot")
msg("📄 Accept Agreement","bot")

let btn=document.createElement("button")
btn.className="option-btn"
btn.innerText="Accept Agreement"
btn.onclick=esign
box().appendChild(btn)

},2000)
}

function esign(){
msg("✍️ eSign Completed","bot")

setTimeout(()=>msg("🏦 Disbursement Initiated","bot"),1000)
setTimeout(()=>msg("💰 Amount Credited","bot"),2000)

setTimeout(()=>{
let acc="RFL"+Math.floor(Math.random()*100000000)
msg("📊 Loan Account Created: "+acc,"bot")
msg("🎉 Your "+data.product+" is successfully disbursed.","bot")
},3000)
}

document.getElementById("userInput").addEventListener("keypress",function(e){
if(e.key==="Enter"){
sendMessage()
}
})

</script>

</body>
</html>
