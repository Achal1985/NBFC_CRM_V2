<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RFL CRM Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* RESET */
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Segoe UI',sans-serif;
}

/* BODY FIX (IMPORTANT FOR MOBILE) */
body{
min-height:100dvh;
display:flex;
align-items:center;
justify-content:center;

background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#00c896);
background-size:400% 400%;
animation:gradientBG 12s ease infinite;

/* FIX MOBILE SCROLL */
padding:15px;
overflow-x:hidden;
}

/* FLOATING LIGHTS */
body::before,
body::after{
content:"";
position:absolute;
border-radius:50%;
filter:blur(80px);
z-index:0;
}

body::before{
width:300px;
height:300px;
background:#00e5ff33;
top:-80px;
left:-80px;
animation:float 10s infinite alternate;
}

body::after{
width:250px;
height:250px;
background:#00ffcc33;
bottom:-80px;
right:-80px;
animation:float 12s infinite alternate-reverse;
}

@keyframes float{
from{transform:translate(0,0);}
to{transform:translate(30px,30px);}
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* CARD */
.login-card{
width:100%;
max-width:380px;
padding:28px;
border-radius:20px;
position:relative;
z-index:2;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,0.2);

box-shadow:
0 0 40px rgba(0,255,200,0.2),
inset 0 0 20px rgba(255,255,255,0.05);

text-align:center;
color:white;

animation:fadeUp 0.8s ease;
}

@keyframes fadeUp{
from{opacity:0; transform:translateY(25px);}
to{opacity:1; transform:translateY(0);}
}

/* LOGO */
.logo{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
font-weight:bold;
margin-bottom:8px;
font-size:clamp(18px,5vw,24px);
flex-wrap:wrap;
}

/* SUBTITLE */
.subtitle{
font-size:14px;
margin-bottom:20px;
opacity:0.85;
}

/* BUTTON */
button{
width:100%;
padding:14px;
margin-bottom:12px;

border:none;
border-radius:12px;

background:linear-gradient(135deg,#00c896,#00e5ff);
color:white;

font-size:15px;
cursor:pointer;

display:flex;
align-items:center;
justify-content:center;
gap:10px;

transition:all 0.3s ease;
}

/* INTERACTION */
button:hover{
transform:scale(1.03);
box-shadow:0 0 15px rgba(0,255,200,0.6);
}

button:active{
transform:scale(0.97);
}

/* FOOTER */
.footer{
margin-top:12px;
font-size:11px;
opacity:0.7;
}

/* 📱 MOBILE PERFECT TUNING */
@media(max-width:480px){

body{
padding:12px;
align-items:center;
}

.login-card{
padding:22px;
border-radius:16px;
}

/* Reduce spacing for small screens */
.subtitle{
margin-bottom:15px;
}

button{
padding:13px;
font-size:14px;
}

}

</style>
</head>

<body>

<div class="login-card">

<div class="logo">
🏦 <span>RFL Customer Login</span>
</div>

<div class="subtitle">
Select Login Type
</div>

<!-- EXISTING CUSTOMER -->
<form action="/login_existing">
<button type="submit">
<i class="fa fa-user"></i> Existing Customer
</button>
</form>

<!-- NEW CUSTOMER -->
<form action="/new_customer">
<button type="submit">
<i class="fa fa-user-plus"></i> New Customer / DSA
</button>
</form>

<div class="footer">
Secure NBFC CRM System
</div>

</div>

</body>
</html>
