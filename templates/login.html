<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RFL CRM Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* RESET */
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Segoe UI',sans-serif;
}

/* ANIMATED BACKGROUND */
body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;

background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#00c896);
background-size:400% 400%;
animation:gradientBG 12s ease infinite;
overflow:hidden;
}

/* FLOATING GLOW EFFECT */
body::before{
content:"";
position:absolute;
width:500px;
height:500px;
background:radial-gradient(circle,#00e5ff33,transparent);
top:-100px;
left:-100px;
filter:blur(80px);
animation:float 10s infinite alternate;
}

body::after{
content:"";
position:absolute;
width:400px;
height:400px;
background:radial-gradient(circle,#00ffcc33,transparent);
bottom:-100px;
right:-100px;
filter:blur(80px);
animation:float 12s infinite alternate-reverse;
}

@keyframes float{
from{transform:translate(0,0);}
to{transform:translate(40px,40px);}
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* GLASS CARD */
.login-card{
width:360px;
padding:35px;
border-radius:20px;
position:relative;
z-index:2;

/* GLASS */
background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);

/* BORDER GLOW */
border:1px solid rgba(255,255,255,0.2);

box-shadow:
0 0 40px rgba(0,255,200,0.2),
inset 0 0 20px rgba(255,255,255,0.05);

text-align:center;
color:white;

animation:fadeUp 0.8s ease;
}

@keyframes fadeUp{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

/* LOGO */
.logo{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
font-weight:bold;
margin-bottom:10px;
font-size:clamp(18px,4.5vw,26px);
flex-wrap:wrap;
line-height:1.3;
}

/* SUBTITLE */
.subtitle{
font-size:14px;
margin-bottom:25px;
opacity:0.85;
letter-spacing:0.5px;
}

/* BUTTONS */
button{
width:100%;
padding:14px;
margin-bottom:15px;

border:none;
border-radius:12px;

background:linear-gradient(135deg,#00c896,#00e5ff);
color:white;

font-size:15px;
cursor:pointer;

display:flex;
align-items:center;
justify-content:center;
gap:10px;

transition:all 0.3s ease;
}

/* HOVER EFFECT */
button:hover{
transform:scale(1.05);
box-shadow:0 0 20px rgba(0,255,200,0.6);
}

/* CLICK EFFECT */
button:active{
transform:scale(0.98);
}

/* ICON STYLE */
button i{
font-size:16px;
}

/* FOOTER */
.footer{
margin-top:15px;
font-size:11px;
opacity:0.7;
}

/* MOBILE */
@media(max-width:420px){
.login-card{
width:90%;
padding:25px;
}
}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">
🏦 <span>RFL Customer Login</span>
</div>

<div class="subtitle">
Select Login Type
</div>

<!-- EXISTING CUSTOMER -->
<form action="/login_existing">
<button type="submit">
<i class="fa fa-user"></i> Existing Customer
</button>
</form>

<!-- NEW CUSTOMER -->
<form action="/new_customer">
<button type="submit">
<i class="fa fa-user-plus"></i> New Customer / DSA
</button>
</form>

<div class="footer">
Secure NBFC CRM System
</div>

</div>

</body>
</html>
