<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RFL CRM Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Segoe UI;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;

background:linear-gradient(-45deg,#1f4037,#99f2c8,#2c5364,#0f2027);
background-size:400% 400%;
animation:gradientBG 10s ease infinite;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.login-card{
width:360px;
padding:40px;
border-radius:18px;

background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);

box-shadow:0 20px 60px rgba(0,0,0,0.4);

text-align:center;
color:white;
}

.logo{
display:flex;
align-items:center;
justify-content:center;
gap:8px;

font-weight:bold;
margin-bottom:10px;

/* ✅ Responsive size */
font-size:clamp(18px, 4.5vw, 26px);

/* ✅ Keep in single line when possible */
flex-wrap:wrap;
text-align:center;
line-height:1.3;
}

/* Fix text alignment */
.logo span{
display:inline-block;
word-break:keep-all;
}

.subtitle{
font-size:14px;
margin-bottom:30px;
opacity:0.8;
}

button{
width:100%;
padding:12px;
margin-bottom:15px;

border:none;
border-radius:8px;

background:#1f4037;
color:white;

font-size:15px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#16332c;
}

.footer{
margin-top:20px;
font-size:11px;
opacity:0.7;
}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">
    🏦 <span>RFL Customer Login</span>
</div>

<div class="subtitle">
Select Login Type
</div>

<!-- EXISTING CUSTOMER -->
<form action="/login_existing">
<button type="submit">
<i class="fa fa-user"></i> Existing Customer
</button>
</form>

<!-- NEW CUSTOMER -->
<form action="/new_customer">
<button type="submit">
<i class="fa fa-user-plus"></i> New Customer / DSA
</button>
</form>

<div class="footer">
Secure NBFC CRM System
</div>

</div>

</body>
</html>
