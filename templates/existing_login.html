<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Existing Customer Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Segoe UI;
}

body{

height:100vh;
display:flex;
align-items:center;
justify-content:center;

background:linear-gradient(-45deg,#1f4037,#99f2c8,#2c5364,#0f2027);
background-size:400% 400%;
animation:gradientBG 10s ease infinite;

}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.login-card{

width:360px;
padding:35px;
border-radius:18px;

background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);

box-shadow:0 20px 60px rgba(0,0,0,0.4);

text-align:center;
color:white;

}

.logo{
font-size:26px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
font-size:13px;
margin-bottom:25px;
opacity:0.8;
}

.input-group{
position:relative;
margin-bottom:18px;
}

.input-group i{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
color:#1f4037;
}

.input-group input{

width:100%;
padding:12px 12px 12px 38px;

border-radius:8px;
border:none;
outline:none;

font-size:14px;
}

button{

width:100%;
padding:12px;

border:none;
border-radius:8px;

background:#1f4037;
color:white;

font-size:15px;
cursor:pointer;

transition:0.3s;
}

button:hover{
background:#16332c;
}

.back-btn{
margin-top:10px;
background:#555;
}

.back-btn:hover{
background:#333;
}

.footer{
margin-top:18px;
font-size:11px;
opacity:0.7;
}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">🏦 RFL CRM</div>

<div class="subtitle">
Existing Customer Login
</div>

<form action="/validate_otp" method="post">

<div class="input-group">
<i class="fa fa-mobile"></i>
<input type="text" name="mobile" placeholder="Enter Mobile Number" required>
</div>

<div class="input-group">
<i class="fa fa-key"></i>
<input type="password" name="otp" placeholder="Enter OTP" required>
</div>

<button type="submit">
<i class="fa fa-sign-in-alt"></i> Login
</button>

</form>

<!-- BACK BUTTON -->
<form action="/">
<button type="submit" class="back-btn">
<i class="fa fa-arrow-left"></i> Back
</button>
</form>

<div class="footer">
Secure NBFC CRM System
</div>

</div>

</body>
</html>
