<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Existing Customer Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* RESET */
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Segoe UI',sans-serif;
}

/* BODY SAME AS LOGIN PAGE */
body{
min-height:100dvh;
display:flex;
align-items:center;
justify-content:center;

background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#00c896);
background-size:400% 400%;
animation:gradientBG 12s ease infinite;

padding:15px;
overflow-x:hidden;
}

/* FLOATING LIGHTS */
body::before,
body::after{
content:"";
position:absolute;
border-radius:50%;
filter:blur(80px);
z-index:0;
}

body::before{
width:300px;
height:300px;
background:#00e5ff33;
top:-80px;
left:-80px;
animation:float 10s infinite alternate;
}

body::after{
width:250px;
height:250px;
background:#00ffcc33;
bottom:-80px;
right:-80px;
animation:float 12s infinite alternate-reverse;
}

@keyframes float{
from{transform:translate(0,0);}
to{transform:translate(30px,30px);}
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* GLASS CARD (SAME AS LOGIN) */
.login-card{
width:100%;
max-width:380px;
padding:28px;
border-radius:20px;
position:relative;
z-index:2;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,0.2);

box-shadow:
0 0 40px rgba(0,255,200,0.2),
inset 0 0 20px rgba(255,255,255,0.05);

text-align:center;
color:white;

animation:fadeUp 0.8s ease;
}

@keyframes fadeUp{
from{opacity:0; transform:translateY(25px);}
to{opacity:1; transform:translateY(0);}
}

/* LOGO */
.logo{
font-size:clamp(18px,5vw,24px);
font-weight:bold;
margin-bottom:8px;
}

/* SUBTITLE */
.subtitle{
font-size:14px;
margin-bottom:20px;
opacity:0.85;
}

/* INPUT GROUP */
.input-group{
position:relative;
margin-bottom:16px;
}

/* ICON */
.input-group i{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
color:#00e5ff;
}

/* INPUT (GLASS STYLE) */
.input-group input{
width:100%;
padding:14px 14px 14px 38px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.2);
outline:none;

background:rgba(255,255,255,0.12);
color:#fff;
font-size:14px;
backdrop-filter:blur(10px);
}

/* BUTTON */
button{
width:100%;
padding:14px;
margin-bottom:12px;

border:none;
border-radius:12px;

background:linear-gradient(135deg,#00c896,#00e5ff);
color:white;

font-size:15px;
cursor:pointer;

display:flex;
align-items:center;
justify-content:center;
gap:10px;

transition:all 0.3s ease;
}

/* HOVER */
button:hover{
transform:scale(1.03);
box-shadow:0 0 15px rgba(0,255,200,0.6);
}

button:active{
transform:scale(0.97);
}

/* BACK BUTTON */
.back-btn{
background:rgba(255,255,255,0.15);
}

/* FOOTER */
.footer{
margin-top:12px;
font-size:11px;
opacity:0.7;
}

/* MOBILE */
@media(max-width:480px){

.login-card{
padding:22px;
border-radius:16px;
}

button{
font-size:14px;
padding:13px;
}

}

/* PLACEHOLDER COLOR FIX */
.input-group input::placeholder{
color:#ffffff;
opacity:1;
}

/* FOR MOBILE & ALL BROWSERS */
.input-group input::-webkit-input-placeholder{
color:#ffffff;
}

.input-group input:-ms-input-placeholder{
color:#ffffff;
}

.input-group input::placeholder{
color:#ffffff;
}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">🏦 RFL CRM</div>

<div class="subtitle">
Existing Customer Login
</div>

<form action="/validate_otp" method="post">

<div class="input-group">
<i class="fa fa-mobile"></i>
<input type="text" name="mobile" placeholder="Enter Mobile Number" required>
</div>

<div class="input-group">
<i class="fa fa-key"></i>
<input type="password" name="otp" placeholder="Enter OTP" required>
</div>

<button type="submit">
<i class="fa fa-sign-in-alt"></i> Login
</button>

</form>

<form action="/">
<button type="submit" class="back-btn">
<i class="fa fa-arrow-left"></i> Back
</button>
</form>

<div class="footer">
Secure NBFC CRM System
</div>

</div>

</body>
</html>
