<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Powered RFL CRM Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{box-sizing:border-box;}

body{
font-family:Segoe UI;
margin:0;
background:linear-gradient(-45deg,#1f4037,#99f2c8,#0f2027,#2c5364);
background-size:400% 400%;
animation:gradientMove 12s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.navbar{
background:rgba(0,0,0,0.6);
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

.container{
max-width:900px;
width:95%;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
text-align:center;
}

.title{
font-size:28px;
margin-bottom:25px;
color:#1f4037;
}

.search-box{
display:flex;
width:100%;
margin-bottom:15px;
}

.search-box input{
flex:1;
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px 0 0 8px;
font-size:14px;
}

.search-box button{
padding:14px 20px;
border:none;
background:#1f4037;
color:white;
cursor:pointer;
}

.voice-btn{
margin-top:10px;
padding:12px 20px;
background:#ff6a00;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.tabs{
display:flex;
justify-content:center;
gap:20px;
margin-top:25px;
flex-wrap:wrap;
}

.tabs button{
padding:10px 20px;
border:none;
background:#eee;
cursor:pointer;
border-radius:6px;
}

.tabs button.active{
background:#1f4037;
color:white;
}

.result-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:25px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 6px 15px rgba(0,0,0,0.2);
text-align:left;
}

.card-title{
font-size:13px;
color:#666;
}

.card-value{
font-size:17px;
font-weight:bold;
color:#1f4037;
}

.chat-box{
height:260px;
overflow:auto;
border:1px solid #ccc;
border-radius:8px;
padding:10px;
background:#fafafa;
margin-top:15px;
}

.chat-input{
display:flex;
margin-top:10px;
}

.chat-input input{
flex:1;
padding:10px;
border:1px solid #ccc;
border-radius:6px 0 0 6px;
}

.chat-input button{
padding:10px 15px;
background:#1f4037;
border:none;
color:white;
border-radius:0 6px 6px 0;
}

.footer{
margin-top:40px;
color:white;
text-align:center;
}

@media(max-width:768px){

.search-box{
flex-direction:column;
}

.search-box input{
border-radius:8px;
margin-bottom:10px;
font-size:14px;
}

.search-box button{
border-radius:8px;
}

.voice-btn{
width:100%;
}

}

</style>

</head>

<body>

<div class="navbar">
<div class="logo">🏦 RFL CRM AI</div>
</div>

<div class="container">

<div class="title">AI Powered RFL CRM Dashboard</div>

<div class="search-box">

<input id="search"
placeholder="Enter Mobile / Loan Account / Customer ID">

<button onclick="searchCRM()">
<i class="fa fa-search"></i> Search
</button>

</div>

<button class="voice-btn" onclick="startVoice()">
🎤 Hindi Voice Search
</button>

<div class="tabs">

<button id="tabCustomer" class="active" onclick="showCustomer()">Customer Loan Details</button>

<button id="tabCommunication" onclick="showCommunication()">Communication Details</button>

<button id="tabHelp" onclick="showHelpDesk()">HelpDesk</button>

</div>

<div id="result"></div>

<div id="helpdesk" style="display:none">

<div class="chat-box" id="chatBox"></div>

<div class="chat-input">

<input id="chatInput" placeholder="Ask HelpDesk...">

<button onclick="sendChat()">Send</button>

</div>

</div>

</div>

<div class="footer">
RFL CRM AI System | Python + Voice Assistant
</div>

<script>

let customerData={}
let communicationData={}

/* TAB HIGHLIGHT FUNCTION */

function activateTab(tabId){

document.querySelectorAll(".tabs button").forEach(btn=>{
btn.classList.remove("active")
})

document.getElementById(tabId).classList.add("active")

}

/* SEARCH FUNCTION */

function searchCRM(){

let query=document.getElementById("search").value.trim()

if(query===""){
alert("Please enter Mobile / Loan Account / Customer ID")
return
}

fetch("/search",{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:"query="+encodeURIComponent(query)
})

.then(response=>response.json())

.then(data=>{

if(data.Message){
document.getElementById("result").innerHTML="<h3>"+data.Message+"</h3>"
return
}

customerData={

"Customer Name":data["Customer Name"],
"Customer ID":data["Customer ID"],
"Mobile":data["Mobile"],
"Loan Account Number":data["Loan Account Number"],
"Loan Amount":data["Loan Amount"],
"Principal Outstanding":data["Principal Outstanding"],
"Interest Outstanding":data["Interest Outstanding"],
"Charges Outstanding":data["Charges Outstanding"],
"Interest Rate":data["Interest Rate"],
"EMI Amount":data["E M I Amount"],
"Loan Status":data["Loan Status"]

}

communicationData={

"Address":data["Address"],
"City":data["City"],
"State":data["State"],
"Pincode":data["Pincode"],
"Email ID":data["Email ID"],
"GST Number":data["GST Number"]

}

showCustomer()

if(data.voice){
speak(data.voice)
}

})

}

/* TAB FUNCTIONS */

function showCustomer(){

activateTab("tabCustomer")

document.getElementById("helpdesk").style.display="none"

renderCards(customerData)

}

function showCommunication(){

activateTab("tabCommunication")

document.getElementById("helpdesk").style.display="none"

renderCards(communicationData)

}

function showHelpDesk(){

activateTab("tabHelp")

document.getElementById("result").innerHTML=""

document.getElementById("helpdesk").style.display="block"

}

/* CARD RENDER */

function renderCards(data){

let html='<div class="result-grid">'

for(let key in data){

html+=`
<div class="card">
<div class="card-title">${key}</div>
<div class="card-value">${data[key]}</div>
</div>
`

}

html+='</div>'

document.getElementById("result").innerHTML=html

}

/* CHATBOT */

function sendChat(){

let input=document.getElementById("chatInput").value

if(!input) return

let box=document.getElementById("chatBox")

box.innerHTML+=`<div><b>You:</b> ${input}</div>`

box.innerHTML+=`<div><b>Bot:</b> CRM HelpDesk received your query.</div>`

document.getElementById("chatInput").value=""

box.scrollTop=box.scrollHeight

}

/* SPEAK */

function speak(text){

const speech=new SpeechSynthesisUtterance(text)
speech.lang="hi-IN"

speechSynthesis.speak(speech)

}

/* VOICE SEARCH */

function startVoice(){

const SpeechRecognition=
window.SpeechRecognition || window.webkitSpeechRecognition

const recognition=new SpeechRecognition()

recognition.lang="hi-IN"

speak("कृपया मोबाइल नंबर, लोन अकाउंट नंबर या कस्टमर आईडी बोलिए")

setTimeout(()=>{
recognition.start()
},2000)

recognition.onresult=function(event){

let transcript=event.results[0][0].transcript

const hindiNums=['०','१','२','३','४','५','६','७','८','९']

for(let i=0;i<10;i++){
transcript=transcript.replace(new RegExp(hindiNums[i],'g'),i)
}

transcript=transcript.replace(/\s+/g,'')
transcript=transcript.toUpperCase()
transcript=transcript.replace(/[^A-Z0-9]/g,'')

document.getElementById("search").value=transcript

recognition.stop()

searchCRM()

}

}

</script>

</body>
</html>
