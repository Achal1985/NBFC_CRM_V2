<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RFL CRM AI Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
box-sizing:border-box;
}

body{
font-family:Segoe UI;
margin:0;
background:linear-gradient(-45deg,#1f4037,#99f2c8,#0f2027,#2c5364);
background-size:400% 400%;
animation:gradientMove 12s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.navbar{
background:rgba(0,0,0,0.6);
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(10px);
}

.logo{
font-size:22px;
font-weight:bold;
}

.container{
max-width:900px;
width:90%;
margin:60px auto;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
text-align:center;
}

.title{
font-size:32px;
margin-bottom:30px;
color:#1f4037;
}

.search-box{
display:flex;
justify-content:center;
margin-bottom:20px;
width:100%;
}

.search-box input{
flex:1;
width:100%;
min-width:0;
padding:14px;
border-radius:8px 0 0 8px;
border:1px solid #ccc;
font-size:16px;
}

.search-box button{
padding:14px 22px;
border:none;
background:#1f4037;
color:white;
cursor:pointer;
font-size:16px;
}

.voice-btn{
margin-top:10px;
padding:12px 24px;
border:none;
background:#ff6a00;
color:white;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

/* TABS */

.tab-header{
display:flex;
justify-content:center;
gap:40px;
margin-top:20px;
font-weight:bold;
}

.tab{
cursor:pointer;
padding:10px 20px;
border-bottom:3px solid transparent;
}

.active-tab{
border-bottom:3px solid #1f4037;
}

.result-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:25px;
}

.crm-card{
background:#ffffff;
border-radius:12px;
padding:15px;
box-shadow:0 6px 18px rgba(0,0,0,0.15);
transition:0.3s;
text-align:left;
}

.crm-title{
font-size:14px;
color:#666;
}

.crm-value{
font-size:18px;
font-weight:bold;
color:#1f4037;
}

.footer{
margin-top:50px;
text-align:center;
color:white;
padding-bottom:30px;
}

/* MOBILE FIX */

@media (max-width:768px){

.container{
padding:25px;
}

.search-box{
flex-direction:column;
width:100%;
}

.search-box input{
width:100%;
font-size:14px;
border-radius:8px;
margin-bottom:10px;
}

.search-box input::placeholder{
font-size:14px;
}

.search-box button{
border-radius:8px;
width:100%;
}

.voice-btn{
width:100%;
}

}

</style>

</head>

<body>

<div class="navbar">
<div class="logo">
<i class="fa-solid fa-building-columns"></i> RFL CRM AI
</div>
</div>

<div class="container">

<div class="title">AI Powered RFL CRM Dashboard</div>

<div class="search-box">
<input id="search" placeholder="Enter Mobile / Loan Account / Customer ID">

<button onclick="searchCRM()">
<i class="fa fa-search"></i> Search
</button>
</div>

<button class="voice-btn" onclick="startVoice()">🎤 Hindi Voice Search</button>

<div class="tab-header">
<div id="tabCustomer" class="tab active-tab" onclick="showCustomer()">Customer Loan Details</div>
<div id="tabComm" class="tab" onclick="showCommunication()">Communication Details</div>
</div>

<div id="result"></div>

</div>

<div class="footer">
RFL CRM AI System | Python + AI Voice Enabled Assistant
</div>

<script>

let voices=[];
let isSpeaking=false;

let customerData={};
let communicationData={};

window.speechSynthesis.onvoiceschanged=()=>{
voices=speechSynthesis.getVoices();
};

function speak(text){

const speech = new SpeechSynthesisUtterance(text);
speech.lang="hi-IN";

let voice = speechSynthesis.getVoices().find(v=>v.lang==="hi-IN");

if(voice){
speech.voice=voice;
}

speech.rate=0.9;

speechSynthesis.speak(speech);

}

function renderCards(data){

let html='<div class="result-grid">';

for(let key in data){

html+=`
<div class="crm-card">
<div class="crm-title">${key}</div>
<div class="crm-value">${data[key]}</div>
</div>
`;

}

html+='</div>';

document.getElementById("result").innerHTML=html;

}

function showCustomer(){

document.getElementById("tabCustomer").classList.add("active-tab");
document.getElementById("tabComm").classList.remove("active-tab");

renderCards(customerData);

}

function showCommunication(){

document.getElementById("tabComm").classList.add("active-tab");
document.getElementById("tabCustomer").classList.remove("active-tab");

renderCards(communicationData);

}

function searchCRM(){

let query=document.getElementById("search").value;

fetch("/search",{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:"query="+query
})
.then(res=>res.json())
.then(data=>{

if(data.Message){

document.getElementById("result").innerHTML=data.Message;
speak(data.Message);
return;

}

customerData={};
communicationData={};

for(let key in data){

if(key=="voice") continue;

if(
key=="Address" ||
key=="City" ||
key=="State" ||
key=="Pincode" ||
key=="Email ID" ||
key=="GST Number"
){
communicationData[key]=data[key];
}
else{
customerData[key]=data[key];
}

}

showCustomer();

if(data.voice){
speak(data.voice);
}

});

}

function startVoice(){

if(isSpeaking){
return;
}

const SpeechRecognition=window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Use Google Chrome");
return;
}

const recognition=new SpeechRecognition();

recognition.lang="hi-IN";
recognition.continuous=false;
recognition.interimResults=false;

speak("कृपया मोबाइल नंबर, लोन अकाउंट नंबर या कस्टमर आईडी बोलिए");

setTimeout(()=>{
recognition.start();
},2000);

recognition.onresult=function(event){

let transcript=event.results[0][0].transcript;

const hindiNums=['०','१','२','३','४','५','६','७','८','९'];

for(let i=0;i<10;i++){
transcript=transcript.replace(new RegExp(hindiNums[i],'g'),i);
}

transcript=transcript.replace(/\s+/g,'');
transcript=transcript.toUpperCase();
transcript=transcript.replace(/[^A-Z0-9]/g,'');

document.getElementById("search").value=transcript;

recognition.stop();

searchCRM();

};

}

</script>

</body>
</html>
