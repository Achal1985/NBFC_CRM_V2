<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>RFL CRM AI Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* GLOBAL */

*{
box-sizing:border-box;
}

body{
font-family:Segoe UI;
margin:0;
background:linear-gradient(-45deg,#1f4037,#99f2c8,#0f2027,#2c5364);
background-size:400% 400%;
animation:gradientMove 12s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* NAVBAR */

.navbar{
background:rgba(0,0,0,0.6);
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(10px);
}

.logo{
font-size:22px;
font-weight:bold;
letter-spacing:1px;
}

.menu i{
margin-left:20px;
cursor:pointer;
transition:0.3s;
}

.menu i:hover{
transform:scale(1.3);
color:#99f2c8;
}

/* MAIN CONTAINER */

.container{
width:900px;
margin:60px auto;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
text-align:center;
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.title{
font-size:32px;
margin-bottom:30px;
color:#1f4037;
}

/* SEARCH */

.search-box{
display:flex;
justify-content:center;
margin-bottom:20px;
}

.search-box input{
width:60%;
padding:14px;
border-radius:8px 0 0 8px;
border:1px solid #ccc;
font-size:16px;
transition:0.3s;
}

.search-box input:focus{
outline:none;
border-color:#1f4037;
box-shadow:0 0 10px rgba(31,64,55,0.5);
}

.search-box button{
padding:14px 22px;
border:none;
background:#1f4037;
color:white;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

.search-box button:hover{
background:#2d6e63;
transform:scale(1.05);
}

/* VOICE BUTTON */

.voice-btn{
margin-top:10px;
padding:12px 24px;
border:none;
background:#ff6a00;
color:white;
border-radius:8px;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

.voice-btn:hover{
background:#ff8c2b;
transform:scale(1.05);
}

/* MIC PULSE ANIMATION */

.voice-active{
animation:pulse 1.2s infinite;
}

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(255,106,0,0.7);}
70%{box-shadow:0 0 0 15px rgba(255,106,0,0);}
100%{box-shadow:0 0 0 0 rgba(255,106,0,0);}
}

/* RESULT CARD */

.result-card{
margin-top:30px;
padding:20px;
background:#f4f6f7;
border-radius:10px;
text-align:left;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
animation:slideUp 0.5s ease;
}

@keyframes slideUp{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.result-row{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #ddd;
}

.label{
font-weight:bold;
color:#333;
}

/* FOOTER */

.footer{
margin-top:50px;
text-align:center;
color:white;
}

</style>

</head>

<body>

<div class="navbar">
<div class="logo">
<i class="fa-solid fa-building-columns"></i> RFL CRM AI
</div>

<div class="menu">
<i class="fa-solid fa-user"></i>
<i class="fa-solid fa-bell"></i>
<i class="fa-solid fa-gear"></i>
</div>
</div>

<div class="container">

<div class="title">AI Powered CRM Dashboard</div>

<div class="search-box">
<input id="search" placeholder="Enter Mobile / Loan Account / Customer ID">

<button onclick="searchCRM()">
<i class="fa fa-search"></i> Search
</button>
</div>

<button class="voice-btn" onclick="startVoice()">🎤 Hindi Voice Search</button>

<div id="result"></div>

</div>

<div class="footer">
RFL CRM AI System | Python + AI
</div>

<script>

/* Load voices */

let voices=[];
let isSpeaking=false;

window.speechSynthesis.onvoiceschanged=()=>{
voices=speechSynthesis.getVoices();
};

/* Female Hindi Voice */

function speak(text){

const speech=new SpeechSynthesisUtterance(text);
speech.lang="hi-IN";

const voice=voices.find(v =>
v.lang.includes("hi") &&
(
v.name.toLowerCase().includes("neerja") ||
v.name.toLowerCase().includes("female") ||
v.name.toLowerCase().includes("google") ||
v.name.toLowerCase().includes("microsoft")
)
);

if(voice){
speech.voice=voice;
}

speech.rate=0.8;
speech.pitch=1.0;

isSpeaking=true;

speech.onend=function(){
isSpeaking=false;
};

speechSynthesis.speak(speech);

}

/* CRM Search */

function searchCRM(){

let query=document.getElementById("search").value;

fetch("/search",{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:"query="+query
})
.then(res=>res.json())
.then(data=>{

let html="";

if(data.Message){

html='<div class="result-card">'+data.Message+'</div>';
speak(data.Message);

}

else{

html='<div class="result-card">';

for(let key in data){

if(key!="voice"){

html+=`
<div class="result-row">
<div class="label">${key}</div>
<div>${data[key]}</div>
</div>
`;

}

}

html+='</div>';

if(data.voice){
speak(data.voice);
}

}

document.getElementById("result").innerHTML=html;

});

}

/* Hindi Voice Input */

function startVoice(){

if(isSpeaking){
console.log("AI speaking, mic disabled");
return;
}

const SpeechRecognition=window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Use Google Chrome for voice recognition");
return;
}

const recognition=new SpeechRecognition();

recognition.lang="hi-IN";
recognition.continuous=false;
recognition.interimResults=false;

document.querySelector(".voice-btn").classList.add("voice-active");

speak("कृपया मोबाइल नंबर बोलिए");

setTimeout(()=>{
recognition.start();
},2000);

recognition.onresult=function(event){

let transcript=event.results[0][0].transcript;

const hindiNums=['०','१','२','३','४','५','६','७','८','९'];

for(let i=0;i<10;i++){
transcript=transcript.replace(new RegExp(hindiNums[i],'g'),i);
}

transcript=transcript.replace(/\D/g,'');

document.getElementById("search").value=transcript;

recognition.stop();

searchCRM();

};

recognition.onerror=function(event){
console.log("Voice error:",event.error);
};

recognition.onend=function(){
document.querySelector(".voice-btn").classList.remove("voice-active");
console.log("Voice input closed");
};

}

</script>

</body>
</html>
