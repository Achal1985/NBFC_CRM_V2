<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Tickets - RFL CRM</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* RESET */
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Segoe UI',sans-serif;
}

/* SAME BACKGROUND AS LOGIN */
body{
min-height:100dvh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#00c896);
background-size:400% 400%;
animation:gradientBG 12s ease infinite;

padding:15px;
overflow-x:hidden;
}

/* FLOATING LIGHT */
body::before,
body::after{
content:"";
position:absolute;
border-radius:50%;
filter:blur(80px);
z-index:0;
}

body::before{
width:300px;
height:300px;
background:#00e5ff33;
top:-80px;
left:-80px;
animation:float 10s infinite alternate;
}

body::after{
width:250px;
height:250px;
background:#00ffcc33;
bottom:-80px;
right:-80px;
animation:float 12s infinite alternate-reverse;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

@keyframes float{
from{transform:translate(0,0);}
to{transform:translate(30px,30px);}
}

/* GLASS CONTAINER */
.container{
width:100%;
max-width:900px;
padding:25px;
border-radius:20px;
z-index:2;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,0.2);

box-shadow:
0 0 40px rgba(0,255,200,0.2),
inset 0 0 20px rgba(255,255,255,0.05);

color:#fff;
animation:fadeUp 0.8s ease;
}

@keyframes fadeUp{
from{opacity:0; transform:translateY(25px);}
to{opacity:1; transform:translateY(0);}
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.logo{
font-size:clamp(18px,4vw,24px);
font-weight:bold;
}

/* BUTTON */
button{
padding:10px 16px;
border:none;
border-radius:10px;
cursor:pointer;

background:linear-gradient(135deg,#00c896,#00e5ff);
color:#fff;

display:flex;
align-items:center;
gap:8px;

transition:0.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 15px rgba(0,255,200,0.6);
}

/* TITLE */
.title{
text-align:center;
font-size:22px;
margin-bottom:15px;
}

/* CARD (GLASS STYLE) */
.card{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(10px);

padding:15px;
border-radius:12px;
margin-top:12px;

border:1px solid rgba(255,255,255,0.2);
box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

/* TEXT */
.ticket-id{
font-weight:bold;
color:#00e5ff;
}

.status{
font-weight:bold;
}

.open{ color:#ff4d4d; }
.progress{ color:#ffc107; }
.closed{ color:#00ff99; }

/* ACTION BUTTONS */
.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
margin-top:20px;
}

/* FOOTER */
.footer{
margin-top:20px;
text-align:center;
font-size:12px;
opacity:0.7;
}

/* MOBILE */
@media(max-width:600px){

.container{
padding:18px;
}

.title{
font-size:18px;
}

button{
width:100%;
justify-content:center;
}

.header{
flex-direction:column;
gap:10px;
}

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
<div class="logo">🏦 RFL CRM AI</div>

<button onclick="goBack()">
<i class="fa fa-arrow-left"></i> Back
</button>
</div>

<div class="title">📋 My Support Tickets</div>

<div id="ticketsContainer"></div>

<!-- ACTION BUTTONS -->
<div class="actions">

<button onclick="goBack()" style="background:#007bff;">
🏠 Dashboard
</button>

<button onclick="showContact()" style="background:#28a745;">
📞 Contact Us
</button>

</div>

<!-- CONTACT POPUP -->
<div id="contactPopup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center;">

<div style="background:white; padding:25px; border-radius:10px; width:320px; text-align:center; color:black;">

<h3>📞 Customer Support</h3>

<a href="tel:18001800001" style="font-size:18px; font-weight:bold; color:#1f4037;">
1800 1800 001
</a>

<br><br>

<button onclick="closeContact()">Close</button>

</div>
</div>

<div class="footer">
RFL CRM AI System | Tickets Dashboard
</div>

</div>

<script>

function goBack(){
    window.location.href="/dashboard"
}

function showContact(){
    document.getElementById("contactPopup").style.display="flex"
}

function closeContact(){
    document.getElementById("contactPopup").style.display="none"
}

function loadTickets(){

fetch("/get_tickets")
.then(res=>res.json())
.then(data=>{

let html=""

if(data.length === 0){
    html = "<h3>No Tickets Found</h3>"
}

data.reverse().forEach(t=>{

let statusClass = "open"

if(t["Status"] === "Closed") statusClass="closed"
if(t["Status"] === "In Progress") statusClass="progress"

html += `
<div class="card">
<div class="ticket-id">${t["Ticket ID"]}</div>
${t["Description"]}<br>
Status: <span class="status ${statusClass}">${t["Status"]}</span>
</div>
`

})

document.getElementById("ticketsContainer").innerHTML = html

})
}

window.onload = loadTickets

</script>

</body>
</html>
