<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Tickets - RFL CRM</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{box-sizing:border-box;}

body{
font-family:Segoe UI;
margin:0;
background:linear-gradient(-45deg,#1f4037,#99f2c8,#0f2027,#2c5364);
background-size:400% 400%;
animation:gradientMove 12s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.navbar{
background:rgba(0,0,0,0.6);
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

.logout-btn{
background:#ff3b3b;
color:white;
border:none;
padding:8px 16px;
border-radius:6px;
cursor:pointer;
}

.container{
max-width:900px;
width:95%;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
text-align:center;
}

@media(max-width:768px){

.container{
    padding:15px;
    margin:20px auto;
}

.title{
    font-size:20px;
}

.voice-btn{
    width:100%;
    font-size:14px;
    padding:10px;
}

.navbar{
    flex-direction:column;
    gap:10px;
    text-align:center;
}

.card{
    font-size:14px;
}

}

.title{
font-size:26px;
margin-bottom:20px;
color:#1f4037;
}

.voice-btn{
margin-top:10px;
padding:12px 18px;
background:#ff6a00;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 6px 15px rgba(0,0,0,0.2);
text-align:left;
margin-top:15px;
}

.ticket-id{
font-weight:bold;
color:#1f4037;
}

.status{
font-weight:bold;
}

.open{ color:red; }
.progress{ color:orange; }
.closed{ color:green; }

.footer{
margin-top:40px;
color:white;
text-align:center;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

<div class="logo">🏦 RFL CRM AI</div>

<div>
<button class="logout-btn" onclick="goBack()">
<i class="fa fa-arrow-left"></i> Back
</button>
</div>

</div>

<!-- MAIN CONTAINER -->
<div class="container">

<div class="title">📋 My Support Tickets</div>
<div id="ticketsContainer"></div>
<!-- ACTION BUTTONS -->
<div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">

<button class="voice-btn" onclick="goBack()" style="background:#007bff;">
🏠 Dashboard
</button>

<button class="voice-btn" onclick="showContact()" style="background:#28a745;">
📞 Contact Us
</button>


<!-- CONTACT POPUP -->
<div id="contactPopup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center;">

<div style="background:white; padding:25px; border-radius:10px; width:320px; text-align:center;">

<h3>📞 Customer Support</h3>

<a href="tel:18001800001" style="font-size:18px; font-weight:bold; color:#1f4037;">
1800 1800 001
</a>

<br><br>

<button onclick="closeContact()">Close</button>

</div>
</div>

<div class="footer">
RFL CRM AI System | Tickets Dashboard
</div>

<script>

function goBack(){
    window.location.href="/dashboard"
}

function showContact(){
    document.getElementById("contactPopup").style.display="flex"
}

function closeContact(){
    document.getElementById("contactPopup").style.display="none"
}

function loadTickets(){

fetch("/get_tickets")
.then(res=>res.json())
.then(data=>{

let html=""

if(data.length === 0){
    html = "<h3>No Tickets Found</h3>"
}

data.reverse().forEach(t=>{

let statusClass = "open"

if(t["Status"] === "Closed") statusClass="closed"
if(t["Status"] === "In Progress") statusClass="progress"

html += `
<div class="card">
<div class="ticket-id">${t["Ticket ID"]}</div>
${t["Description"]}<br>
Status: <span class="status ${statusClass}">${t["Status"]}</span>
</div>
`

})

document.getElementById("ticketsContainer").innerHTML = html

})
}

window.onload = loadTickets

</script>

</body>
</html>
