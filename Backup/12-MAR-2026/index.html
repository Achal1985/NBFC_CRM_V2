<!DOCTYPE html>
<html>
<head>

<title>RFL CRM AI Chatbot</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family: 'Poppins', sans-serif;
background: linear-gradient(135deg,#1d2671,#c33764);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
margin:0;
}

.container{
background:white;
width:600px;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
text-align:center;
}

h1{
color:#1d2671;
margin-bottom:5px;
}

.subtitle{
color:gray;
margin-bottom:25px;
}

input{
width:80%;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
font-size:15px;
margin-bottom:15px;
}

button{
padding:12px 25px;
background:#1d2671;
color:white;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#c33764;
}

.result-box{
margin-top:20px;
text-align:left;
background:#f5f5f5;
padding:15px;
border-radius:6px;
min-height:120px;
}

.data{
margin:6px 0;
}

.footer{
margin-top:20px;
font-size:12px;
color:gray;
}

</style>

</head>

<body>

<div class="container">

<h1>RFL CRM Assistant</h1>
<div class="subtitle">Loan Information Chatbot</div>

<input type="text" id="loan" placeholder="Enter Loan Account Number (Example: LAN10001)">

<br>

<button onclick="getLoan()">Search Loan</button>

<div class="result-box" id="result">

Loan information will appear here...

</div>

<div class="footer">
Powered by Python + Flask CRM Bot
</div>

</div>

<script>

function getLoan(){

let loan=document.getElementById("loan").value;

fetch("/getdata",{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:"query="+loan
})

.then(res=>res.json())

.then(data=>{

let html="";

for(let key in data){

html += "<div class='data'><b>"+key+"</b> : "+data[key]+"</div>";

}

document.getElementById("result").innerHTML = html;

})

}

</script>

</body>
</html>
