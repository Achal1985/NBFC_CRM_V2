<!DOCTYPE html>
<html>

<head>

<title>RFL CRM Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:800px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

.header{
text-align:center;
margin-bottom:25px;
}

.header h1{
color:#203a43;
}

.header p{
color:gray;
font-size:14px;
}

.search-box{
display:flex;
gap:10px;
margin-bottom:25px;
}

input{
flex:1;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
font-size:15px;
}

button{
padding:12px 25px;
background:#203a43;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#2c5364;
}

.result-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:#f5f7fa;
padding:15px;
border-radius:8px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card b{
color:#203a43;
}

.footer{
text-align:center;
margin-top:20px;
color:gray;
font-size:12px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>RFL CRM Assistant</h1>
<p>Loan Information System</p>
</div>

<div class="search-box">

<input type="text" id="loan" placeholder="Enter Mobile Number / Loan Account Number / Customer ID">

<button onclick="getLoan()">Search Loan</button>

</div>

<div id="result" class="result-grid">

</div>

<div class="footer">
Powered by Python Flask CRM Bot
</div>

</div>

<script>

function getLoan(){

let loan=document.getElementById("loan").value;

fetch("/getdata",{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:"query="+loan
})

.then(res=>res.json())

.then(data=>{

let html="";

for(let key in data){

html += `
<div class="card">
<b>${key}</b><br>
${data[key]}
</div>
`;

}

document.getElementById("result").innerHTML=html;

})

}

</script>

</body>
</html>
